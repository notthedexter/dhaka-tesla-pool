services:
  db:
    image: postgres:16-alpine
    container_name: dhaka_tesla_pool_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-teslapool}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teslapool123}
      POSTGRES_DB: ${DB_NAME:-dhaka_tesla_pool}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teslapool} -d ${DB_NAME:-dhaka_tesla_pool}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dhaka_tesla_pool_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-teslapool}:${DB_PASSWORD:-teslapool123}@db:5432/${DB_NAME:-dhaka_tesla_pool}
      JWT_SECRET: ${JWT_SECRET:-dhaka-tesla-pool-super-secret-key-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dhaka_tesla_pool_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - api

volumes:
  pgdata:
